# The data directory cannot be written -- the mistake that leaves a container
# unable to keep an account, e.g. a volume owned by another user.
#
# Mounted read-only here so the failure is deterministic and needs no root on
# the host. The app must refuse to start, with a message that points at the
# directory, rather than start and lose every session at the first restart.
# The OIDC settings are complete (required); the IdP is deliberately absent,
# which is not an error -- the store is what fails here.
services:
  subject:
    image: oidcgate-subject:integration
    pull_policy: never
    user: "${RUN_AS}"
    restart: "no"
    ports:
      - "127.0.0.1::8080"
    volumes:
      - ./data:/app/data:ro
    environment:
      DEMO_OIDC_ISSUER: "http://fakeidp:8080"
      DEMO_OIDC_CLIENT_ID: "cid"
      DEMO_OIDC_CLIENT_SECRET: "csecret"
      DEMO_OIDC_BASE_URL: "http://subject:8080"
