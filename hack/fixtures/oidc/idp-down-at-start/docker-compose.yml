# OIDC is configured, but the IdP is not running when the app starts (it is
# under the "late" profile, so `up` leaves it out; the test starts it later).
#
# The app must start anyway, explain on the fallback page that the provider is
# not reachable, and start sending page loads to the IdP once it appears,
# without a restart. There is deliberately no depends_on.
services:
  fakeidp:
    image: oidcgate-fakeidp:integration
    pull_policy: never
    profiles: ["late"]
    ports:
      - "127.0.0.1::8080"
    environment:
      ISSUER: "http://fakeidp:8080"
      REDIRECT_URI: "http://subject:8080/auth/callback"

  subject:
    image: oidcgate-subject:integration
    pull_policy: never
    user: "${RUN_AS}"
    ports:
      - "127.0.0.1::8080"
    volumes:
      - ./data:/app/data
    environment:
      DEMO_OIDC_ISSUER: "http://fakeidp:8080"
      DEMO_OIDC_CLIENT_ID: "cid"
      DEMO_OIDC_CLIENT_SECRET: "csecret"
      DEMO_OIDC_BASE_URL: "http://subject:8080"
