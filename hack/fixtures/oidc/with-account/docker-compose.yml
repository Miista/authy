# OIDC configured and a local account already exists.
#
# data/auth/auth.json is seeded: user "alice", password "correct horse battery"
# (a bcrypt hash at the minimum cost, and a throwaway signing key -- test
# values, not secrets). The IdP is tried first; the local form stays reachable
# at /auth/login, which is the way in when the IdP is down.
services:
  fakeidp:
    image: oidcgate-fakeidp:integration
    pull_policy: never
    ports:
      - "127.0.0.1::8080"
    environment:
      ISSUER: "http://fakeidp:8080"
      REDIRECT_URI: "http://subject:8080/auth/callback"

  subject:
    image: oidcgate-subject:integration
    pull_policy: never
    user: "${RUN_AS}"
    depends_on:
      - fakeidp
    ports:
      - "127.0.0.1::8080"
    volumes:
      - ./data:/app/data
    environment:
      DEMO_OIDC_ENABLED: "true"
      DEMO_OIDC_ISSUER: "http://fakeidp:8080"
      DEMO_OIDC_CLIENT_ID: "cid"
      DEMO_OIDC_CLIENT_SECRET: "csecret"
      DEMO_OIDC_BASE_URL: "http://subject:8080"
