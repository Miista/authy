# The IdP does not approve the login (FAKEIDP_DENY).
#
# The user must land on the fallback page with a retry button, once, and not
# be bounced back to the IdP in a loop. There is no form: sign-in is the IdP's.
services:
  fakeidp:
    image: authy-fakeidp:integration
    pull_policy: never
    ports:
      - "127.0.0.1::8080"
    environment:
      ISSUER: "http://fakeidp:8080"
      REDIRECT_URI: "http://subject:8080/auth/callback"
      FAKEIDP_DENY: "true"

  subject:
    image: authy-subject:integration
    pull_policy: never
    user: "${RUN_AS}"
    depends_on:
      - fakeidp
    ports:
      - "127.0.0.1::8080"
    volumes:
      - ./data:/app/data
    environment:
      DEMO_OIDC_ISSUER: "http://fakeidp:8080"
      DEMO_OIDC_CLIENT_ID: "cid"
      DEMO_OIDC_CLIENT_SECRET: "csecret"
      DEMO_OIDC_BASE_URL: "http://subject:8080"
